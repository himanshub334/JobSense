services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobsense}
      POSTGRES_USER: ${POSTGRES_USER:-jobsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsense}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobsense} -d ${POSTGRES_DB:-jobsense}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsense}:${POSTGRES_PASSWORD:-jobsense}@db:5432/${POSTGRES_DB:-jobsense}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsense}:${POSTGRES_PASSWORD:-jobsense}@db:5432/${POSTGRES_DB:-jobsense}
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
    command: celery -A app.worker.celery_app worker --loglevel=INFO
  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobsense}:${POSTGRES_PASSWORD:-jobsense}@db:5432/${POSTGRES_DB:-jobsense}
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
    command: celery -A app.worker.celery_app beat --loglevel=INFO
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  pgdata:
